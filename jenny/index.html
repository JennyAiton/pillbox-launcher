.ans button{border:1px solid var(--edge);border-radius:14px;padding:7px 11px;font:700 12.5px var(--sans);background:rgba(255,255,255,.05)}
.ans button[aria-pressed="true"]{background:var(--acc);color:var(--ink);border-color:transparent}
.ans button.neg[aria-pressed="true"]{background:var(--bad);color:#3a0000}
.ans button.mid[aria-pressed="true"]{background:var(--warn);color:#3a2a00}
.q input[type=text],.setup textarea{width:100%;font:600 13px var(--sans);color:var(--text);background:rgba(255,255,255,.07);border:1px solid var(--edge);border-radius:12px;padding:9px 11px}
.setup textarea{min-height:90px;resize:vertical}
.flag{border-left:4px solid var(--warn)} .flag.red{border-left-color:var(--bad)}
.flag .lv{font:800 9.5px var(--sans);letter-spacing:1.5px;text-transform:uppercase}
.nav{display:flex;gap:10px;margin-top:16px}
.nav .pill{position:static}
.gocard{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.04));border:1px solid var(--acc);border-radius:20px;padding:14px;width:100%;text-align:left;margin-top:16px}
.gocard .ic{font-size:26px}
.gocard b{display:block;font:600 21px var(--serif)}
.left{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:8px}
.left i{display:block;height:100%;border-radius:3px}
@media (prefers-reduced-motion:no-preference){ .dotp.now{animation:glow 2.4s ease-in-out infinite} .pill:not(.done){animation:pulse 3s ease-in-out infinite} }
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(255,255,255,.12),0 0 34px var(--acc)}}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(255,255,255,.08),0 0 42px var(--acc)}}

    saveLog(S.who, TODAY, L => { L.skip = L.skip || {}; L.items = L.items || {};
      if(L.skip[d.skip]){ delete L.skip[d.skip]; was = true; return; }

/* tablet photos: shrink on the phone, store as an asset, keep its id in meta/pills */
let assets = null, snapFor = "";
function shrink(file){
  return new Promise((ok, bad) => { const img = new Image(); img.onload = () => { const s = Math.min(1, 600/Math.max(img.width, img.height)); const c = document.createElement("canvas"); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); c.toBlob(b => b ? ok(b) : bad(new Error("no image")), "image/jpeg", .82); URL.revokeObjectURL(img.src); }; img.onerror = bad; img.src = URL.createObjectURL(file); });
}
document.getElementById("snap").addEventListener("change", async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = ""; if(!f || !snapFor || !assets) return;
  const nm = snapFor; snapFor = ""; toast("Saving the photo…");
  try {
    const blob = await shrink(f); const url = await new Promise(ok => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.readAsDataURL(blob); });
    S.pimg = Object.assign({}, S.pimg, {[nm]: url}); render(true); save("pillimg/"+nm, {img:url}); toast("Photo saved ✓");
  } catch(err){ toast(err && err.code === "too_large" ? "That photo is too big" : "The photo didn't save, try again"); }
});

/* ---------------- Supabase: sign in, then load and listen ---------------- */
const SB = supabase.createClient(SB_URL, SB_KEY);
function mkDb(){
  return {
    doc(path){
      const i = path.indexOf("/"), coll = path.slice(0, i), id = path.slice(i+1);
      return { set: async body => { const { error } = await SB.from("docs").upsert({coll, id, data:body, updated_at:new Date().toISOString()}); if(error) throw error; } };
    },
    collection(coll){
      let flt = null;
      const q = {
        where(f, op, v){ flt = [f, v]; return q; },
        onSnapshot(cb, err){
          const load = async () => {
            let r = SB.from("docs").select("id,data").eq("coll", coll);
            if(flt) r = r.gte("data->>"+flt[0], flt[1]);
            const { data, error } = await r;
            if(error){ if(err) err(error); return; }
            cb({ docs: data.map(d => ({id:d.id, data:() => d.data})), metadata:{fromCache:false, hasPendingWrites:false} });
          };
          load();
          SB.channel("docs_"+coll).on("postgres_changes", {event:"*", schema:"public", table:"docs", filter:"coll=eq."+coll}, () => load()).subscribe();
          setInterval(load, 60000);
          document.addEventListener("visibilitychange", () => { if(!document.hidden) load(); });
        }
      };
      return q;
    }
  };
}
assets = {};
const _render = render; render = (...a) => { if(window.__planReady) _render(...a); };
async function start(session){
  document.getElementById("login").style.display = "none";
  const mine = EMAILS[(session.user.email||"").toLowerCase()];
  if(mine){ S.who = mine; window.ME = mine === "jenny" ? "Jenny" : "Michaela"; }
  const pl = await SB.from("docs").select("data").eq("coll","plan").eq("id","plan").maybeSingle();
  if(pl.error || !pl.data){ status("Can't load your plan - check the internet", true); document.getElementById("login").style.display = "grid"; document.getElementById("loginMsg").textContent = "Signed in, but the plan didn't load. Try again."; return; }
  applyPlan(pl.data.data); render();
  db = mkDb();
  const to = setTimeout(() => status("Can't reach saved ticks yet", true), 10000);
  const from = (() => { const d = new Date(); d.setDate(d.getDate()-60); return ymd(d); })();
  db.collection("log").where("date", ">=", from).onSnapshot(snap => {
    for(const doc of snap.docs) S.log[doc.id] = JSON.parse(JSON.stringify(doc.data()));
    clearTimeout(to); status("Saved"); render(true);
  }, () => { clearTimeout(to); status("Saved ticks can't be loaded", true); });
  db.collection("nudge").onSnapshot(snap => { for(const doc of snap.docs) S.nudge[doc.id] = doc.data(); render(true); }, () => {});
  db.collection("pillimg").onSnapshot(snap => { S.pimg = S.pimg || {}; for(const doc of snap.docs) S.pimg[doc.id] = (doc.data()||{}).img; render(true); }, () => {});
  let firstMeta = true;
  db.collection("meta").onSnapshot(snap => {
    for(const doc of snap.docs) S.meta[doc.id] = JSON.parse(JSON.stringify(doc.data()));
    for(const k of ["scripts","checks","settings","refill","pills","setup"]) S.meta[k] = S.meta[k] || {};
    if(firstMeta){ firstMeta = false;
      let seen = false; try { seen = !!localStorage.getItem("pillbox.setupSeen."+S.who); } catch(_){}
      if(!setupOf(S.who).done && !seen && !S.setup){ S.setup = {p:S.who, step:0}; try{localStorage.setItem("pillbox.setupSeen."+S.who,"1")}catch(_){} }
    }
    render(true);
  }, () => {});
}
document.getElementById("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const msg = document.getElementById("loginMsg"); msg.textContent = "Signing in…";
  const { data, error } = await SB.auth.signInWithPassword({ email: document.getElementById("lEmail").value.trim(), password: document.getElementById("lPass").value });
  if(error){ msg.textContent = "That didn't work. Check the email and password."; return; }
  msg.textContent = ""; start(data.session);
});
SB.auth.getSession().then(({ data }) => { if(data.session) start(data.session); else document.getElementById("login").style.display = "grid"; });
