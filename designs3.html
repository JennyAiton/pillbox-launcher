<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Well Together - 5 new ideas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@500;600;700;800&family=Caveat:wght@600;700&display=swap">
<style>
:root{--serif:"Cormorant Garamond",Georgia,serif;--sans:"Manrope",system-ui,sans-serif;--ink:#2c3e57;--pink:#f19bb5;--pink2:#d9668f;--blue:#8fcbe8}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#eef6fb,#fdeef3);color:var(--ink);font:15px/1.45 var(--sans)}
header{padding:28px 16px 6px;text-align:center}header h1{font:600 40px var(--serif);margin:0}header p{margin:6px auto 0;max-width:680px;color:#5b6b7a}
.opt{max-width:1100px;margin:24px auto;padding:18px 16px 24px;border-radius:28px;background:#fff;box-shadow:0 10px 30px rgba(40,70,100,.08)}
.opt h2{font:600 32px var(--serif);margin:0}.opt .idea{color:#5b6b7a;margin:4px 0 6px;max-width:780px}.opt .why{font:700 13px var(--sans);color:var(--pink2);margin:0 0 14px}
.num{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;font:800 15px var(--sans);margin-right:8px;vertical-align:6px}
.phones{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.ph{width:280px;height:590px;border-radius:38px;padding:9px;background:#1b1f2a;box-shadow:0 16px 40px rgba(0,0,0,.25);flex:none}
.sc{position:relative;width:100%;height:100%;border-radius:30px;overflow:hidden;font-size:11px;background:#cfe9fa}
.cap{text-align:center;font:700 12px var(--sans);color:#5b6b7a;margin-top:8px}
.scene{position:absolute;left:0;top:0;width:100%;height:600px}
.scene .fr{transform-box:view-box}.scene .fl{transform-origin:0 0}.scene .frr{transform-origin:400px 0}.scene .bob,.scene .rip{transform-box:fill-box;transform-origin:center}.scene .bfly,.scene .ffly{transform-box:view-box}.scene .rays,.scene .birds{display:none}
@media (prefers-reduced-motion:no-preference){.scene .fl{animation:sway 7s ease-in-out infinite alternate}.scene .frr{animation:sway 8.5s ease-in-out infinite alternate-reverse}.scene .crown{animation:sway 6s ease-in-out infinite alternate}.scene .bob{animation:bob 4s ease-in-out infinite alternate}.scene .rip{animation:ripple 6s ease-out infinite}.scene .bfly{animation:fly1 18s ease-in-out infinite}.scene .bfly.b2{animation:fly2 22s ease-in-out infinite}.scene .wing{animation:flap .35s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:right center}.scene .wing.r{transform:scaleX(-1);animation-name:flapr;transform-origin:left center}.scene .shim{animation:shim 3.5s ease-in-out infinite alternate}.scene .petal{animation:fall 13s linear infinite}.glow{animation:glow 2.4s ease-in-out infinite}.swing{animation:swing 3s ease-in-out infinite alternate}}
@keyframes sway{from{transform:rotate(-2.2deg)}to{transform:rotate(2.2deg)}}@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}@keyframes ripple{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.7);opacity:0}}@keyframes fly1{0%{transform:translate(40px,250px)}25%{transform:translate(150px,215px)}50%{transform:translate(250px,262px)}75%{transform:translate(140px,290px)}100%{transform:translate(40px,250px)}}@keyframes fly2{0%{transform:translate(360px,230px)}30%{transform:translate(260px,200px)}60%{transform:translate(200px,250px)}100%{transform:translate(360px,230px)}}@keyframes flap{from{transform:scaleX(1)}to{transform:scaleX(.35)}}@keyframes flapr{from{transform:scaleX(-1)}to{transform:scaleX(-.35)}}@keyframes shim{from{opacity:.15}to{opacity:.6}}@keyframes fall{0%{transform:translate(0,-20px) rotate(0);opacity:0}8%{opacity:.85}100%{transform:translate(70px,620px) rotate(300deg);opacity:0}}
@keyframes glow{0%,100%{box-shadow:0 0 0 4px rgba(241,155,181,.35)}50%{box-shadow:0 0 0 10px rgba(241,155,181,.1)}}@keyframes swing{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.glass{background:rgba(255,255,255,.82);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.9)}
.btn{display:inline-block;border-radius:14px;padding:9px 12px;font:800 11px var(--sans);text-align:center}.b1{background:var(--ink);color:#fff}.b2{background:#fff;color:var(--ink);border:1px solid rgba(44,62,87,.2)}
.tb{position:absolute;left:10px;right:10px;bottom:10px;height:44px;border-radius:18px;display:flex;justify-content:space-around;align-items:center;font:800 8.5px var(--sans);background:rgba(255,255,255,.9);color:var(--ink);box-shadow:0 4px 16px rgba(0,0,0,.12)}
.tb span{display:grid;justify-items:center;opacity:.55}.tb span.on{opacity:1;color:var(--pink2)}.tb i{font-style:normal;font-size:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 8px;border-radius:12px;margin-top:5px;font:700 10.5px var(--sans);background:rgba(255,255,255,.8)}
.big{font:600 30px/1 var(--serif);margin:4px 0}.lead{display:inline-block;font:800 8.5px var(--sans);letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--pink);color:#fff}
.hand{font:700 22px/1 Caveat,cursive}
</style></head><body>
<header><h1>Well Together: 5 new ideas</h1><p>Same lotus pond, palms, blue and pink, all your features. Five very different ways to use it. Each shows <b>Today</b> and one more screen. Pick a number, or mix them.</p></header>
<main id="opts"></main>
<script>
/* drawn scene, round 2 (19 Nov 2026, Jenny: "combine lotus and palm trees ... lively and inspiring"). i = time of day 1..5.
   The scene is a fixed-height backdrop at the top; the pond sits in the strip between the day curve and the card. */
const SKY = {6:["#cfe9fa","#fde4ee","#a8dcec","#79c2dc"], 7:["#141c43","#4a3f7d","#27507a","#14304f"], 1:["#ffd9b8","#f7b39a","#5fa8a3","#1f6466"], 2:["#bfe6f0","#e6f5e9","#4fb0a5","#16696a"], 3:["#9fd8ef","#dff3f4","#3fa79d","#126361"], 4:["#ffc58f","#f08f74","#3f8f93","#17505d"], 5:["#1c2a48","#33467a","#1d4f63","#0e2a3a"]};
function frond(x, y, a, len, col){ // one palm frond: a curved rib with leaflets
  let leaves = ""; const n = 12;
  for(let k = 1; k <= n; k++){ const t = k/(n+1), px = t*len, py = Math.sin(t*Math.PI)*len*.12, l = len*(.36 - t*.2);
    leaves += `<path d="M${px.toFixed(1)} ${py.toFixed(1)} q ${(l*.35).toFixed(1)} ${(l*.25).toFixed(1)} ${(l*.75).toFixed(1)} ${(l*.95).toFixed(1)} q ${(-l*.45).toFixed(1)} ${(-l*.35).toFixed(1)} ${(-l*.75).toFixed(1)} ${(-l*.95).toFixed(1)}z"/><path d="M${px.toFixed(1)} ${py.toFixed(1)} q ${(l*.35).toFixed(1)} ${(-l*.25).toFixed(1)} ${(l*.75).toFixed(1)} ${(-l*.95).toFixed(1)} q ${(-l*.45).toFixed(1)} ${(l*.35).toFixed(1)} ${(-l*.75).toFixed(1)} ${(l*.95).toFixed(1)}z"/>`; }
  return `<g transform="translate(${x} ${y}) rotate(${a})" fill="${col}"><path d="M0 0 Q ${len*.5} ${len*.16} ${len} ${len*.02}" stroke="${col}" stroke-width="3" fill="none"/>${leaves}</g>`;
}
function palmTree(bx, by, tx, ty, scale, c1, c2, cls){ // trunk from the shore up to a crown of fronds
  const mx = (bx + tx) / 2 + (tx > bx ? -30 : 30), my = (by + ty) / 2;
  let rings = ""; for(let k = 1; k < 9; k++){ const t = k/9, x = (1-t)*(1-t)*bx + 2*(1-t)*t*mx + t*t*tx, y = (1-t)*(1-t)*by + 2*(1-t)*t*my + t*t*ty; rings += `<path d="M${(x-6).toFixed(1)} ${y.toFixed(1)} q 6 4 12 0" stroke="#5b3d28" stroke-width="1.6" fill="none" opacity=".5"/>`; }
  const fr = [[200,1],[235,.92],[270,1.02],[305,.95],[340,1],[20,.9],[160,.88]].map(([a, k]) => frond(0, 0, a, 120*scale*k, a % 2 ? c1 : c2)).join("");
  return `<path d="M${bx} ${by} Q ${mx} ${my} ${tx} ${ty}" stroke="#7a5638" stroke-width="${9*scale}" stroke-linecap="round" fill="none"/>${rings}<g class="crown ${cls}" style="transform-origin:${tx}px ${ty}px">${`<g transform="translate(${tx} ${ty})">${fr}<circle r="${6*scale}" fill="#6b4a2f"/><circle cx="${7*scale}" cy="${4*scale}" r="${5*scale}" fill="#7d5a36"/></g>`}</g>`;
}
function lotusFlower(x, y, sc, p, d){ // layered petals with a soft gradient, golden heart
  const id = `lp${p[0]}${Math.round(x)}`;
  const pet = (r, s, f) => `<path transform="rotate(${r}) scale(${s})" d="M0 0 C -11 -16 -9 -40 0 -52 C 9 -40 11 -16 0 0Z" fill="${f}"/>`;
  return `<g transform="translate(${x} ${y}) scale(${sc})"><g class="bob" style="animation-delay:-${d}s"><defs><linearGradient id="${id}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="${p[0]}"/><stop offset="1" stop-color="${p[1]}"/></linearGradient></defs>
    <ellipse cx="0" cy="4" rx="34" ry="8" fill="#000" opacity=".12"/>${[-72,72,-52,52].map(r => pet(r, .9, p[2])).join("")}${[-30,30,-14,14].map(r => pet(r, 1, `url(#${id})`)).join("")}${pet(0, 1.05, `url(#${id})`)}
    <ellipse cx="0" cy="-8" rx="9" ry="5" fill="#f7cf5a"/><g fill="#e9a93a">${[-6,-2,2,6].map(dx => `<circle cx="${dx}" cy="-10" r="1.2"/>`).join("")}</g></g></g>`;
}
function bud(x, y, sc, p){ return `<g transform="translate(${x} ${y}) scale(${sc})"><g class="bob"><path d="M0 0 v 24" stroke="#3f7a52" stroke-width="2.5"/><path d="M0 0 C -9 -12 -6 -26 0 -32 C 6 -26 9 -12 0 0Z" fill="${p[1]}"/><path d="M0 0 C -4 -10 -3 -22 0 -28" stroke="${p[0]}" stroke-width="2" fill="none"/></g></g>`; }
function lilyPad(x, y, rx, col, rot){ return `<g transform="translate(${x} ${y}) rotate(${rot})"><path d="M0 0 L ${rx} -${rx*.12} A ${rx} ${rx*.36} 0 1 1 ${rx} ${rx*.12} Z" fill="${col}"/><path d="M0 0 L ${-rx*.7} ${-rx*.12} M0 0 L ${-rx*.5} ${rx*.2} M0 0 L ${rx*.3} ${rx*.28}" stroke="#ffffff" stroke-opacity=".18" stroke-width="1.2"/></g>`; }
function butterfly(cls, c1, c2){ const w = `<path d="M0 0 C -10 -12 -18 -6 -14 2 C -12 8 -4 6 0 0Z" fill="${c1}"/><path d="M0 0 C -8 6 -12 14 -6 14 C -2 13 0 6 0 0Z" fill="${c2}"/>`;
  return `<g class="bfly ${cls}"><g class="wing">${w}</g><g class="wing r">${w}</g><path d="M0 -4 v 10" stroke="#3b2a2a" stroke-width="1.6"/></g>`; }
function scene(p, i, bloom){ if(bloom === undefined) bloom = 4; const starry = i === 5; i = i === 5 ? 7 : 6; // soft blue by day, soft lilac in the evening
  const c = SKY[i] || SKY[2], night = starry, dusk = i === 4 || i === 1;
  const petals = ["#fff4f2", "#f6b8bf", "#ee9fad"]; // same pond for both
  const leaf = night ? "#1c4a3a" : "#2f7a4f", leaf2 = night ? "#255a45" : "#46955f", pad1 = night ? "#2a5e46" : "#4fa36a", pad2 = night ? "#234f3c" : "#3d8c58";
  const sun = night ? `<circle cx="300" cy="160" r="20" fill="#fbf4dc"/><circle cx="292" cy="154" r="20" fill="${c[0]}" opacity=".0"/>`
    : `<g class="rays" style="transform-origin:300px 205px">${[...Array(12)].map((_, k) => `<path transform="rotate(${k*30} 300 205)" d="M300 150 l 5 -26 l 5 26z" fill="#fff4c9" opacity=".55"/>`).join("")}</g><circle cx="300" cy="205" r="${dusk ? 34 : 28}" fill="${dusk ? "#ffd27a" : "#fff1b8"}"/>`;
  const stars = night ? [...Array(22)].map((_, k) => `<circle class="tw" style="animation-delay:-${(k*.37)%3}s" cx="${(k*73)%400}" cy="${20 + (k*41)%170}" r="${k % 3 ? 1.1 : 1.8}" fill="#fff"/>`).join("") : "";
  const birds = night ? "" : `<g class="birds" fill="none" stroke="#2c3e46" stroke-width="2" stroke-linecap="round"><path d="M0 0 q 6 -6 12 0 q 6 -6 12 0"/><path d="M30 14 q 5 -5 10 0 q 5 -5 10 0"/><path d="M-22 18 q 4 -4 8 0 q 4 -4 8 0"/></g>`;
  const flyers = night ? [...Array(6)].map((_, k) => `<circle class="ffly" style="animation-delay:-${k*1.3}s" cx="${50 + k*55}" cy="${250 + (k%3)*22}" r="2.2" fill="#fff3a8"/>`).join("")
    : butterfly("b1", "#f6a65a", "#f4c26a") + butterfly("b2", "#9fd0f0", "#c7a7e8");
  return `<svg class="scene" viewBox="0 0 400 860" preserveAspectRatio="xMidYMin slice" aria-hidden="true"><defs><linearGradient id="sky${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c[0]}"/><stop offset="1" stop-color="${c[1]}"/></linearGradient><linearGradient id="wat${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c[2]}"/><stop offset=".5" stop-color="${c[3]}"/></linearGradient></defs>
    <rect width="400" height="235" fill="url(#sky${i})"/>${stars}${sun}${birds}
    <path d="M0 222 Q 50 196 110 214 T 230 206 T 330 210 T 400 204 V 240 H 0Z" fill="${leaf2}" opacity=".55"/><path d="M0 232 Q 80 214 170 228 T 400 222 V 240 H 0Z" fill="${leaf}" opacity=".6"/>
    <rect y="234" width="400" height="626" fill="url(#wat${i})"/>
    <g class="shim" stroke="#fff" stroke-linecap="round" stroke-width="1.6"><path d="M250 246 h40 M262 254 h22 M120 262 h30 M40 250 h26 M200 300 h34 M320 296 h28"/></g>
    <g class="rip"><ellipse cx="190" cy="285" rx="34" ry="7" fill="none" stroke="#fff" stroke-opacity=".45"/></g><g class="rip r2"><ellipse cx="330" cy="318" rx="26" ry="6" fill="none" stroke="#fff" stroke-opacity=".45"/></g>
    ${lilyPad(70, 262, 34, pad2, -6)}${lilyPad(165, 318, 46, pad1, 10)}${lilyPad(300, 268, 30, pad1, -14)}${lilyPad(345, 330, 40, pad2, 6)}${lilyPad(240, 345, 34, pad2, -4)}${lilyPad(30, 330, 30, pad1, 14)}
    ${palmTree(26, 250, 74, 70, 1.05, leaf, leaf2, "cl")}${palmTree(392, 246, 336, 96, .9, leaf2, leaf, "cr")}
    ${bud(118, 270, .8, petals)}${bud(268, 262, .7, petals)}
    ${[[84, 262, .62, 0], [178, 290, .95, 1.2], [300, 268, .7, 2.1], [352, 300, .85, .6]].map(([x, y, sc, d], k) => k < bloom ? lotusFlower(x, y, sc, petals, d) : bud(x, y + 6, sc * .9, petals)).join("")}
    <g class="fr fl">${frond(-24, -14, 34, 170, leaf)}${frond(-20, 10, 58, 140, leaf2)}</g><g class="fr frr">${frond(424, -14, 146, 170, leaf)}${frond(420, 12, 122, 140, leaf2)}</g>
    ${flyers}
    ${night ? "" : [[60,0],[200,4],[330,8]].map(([x, d]) => `<g transform="translate(${x} 0)"><path class="petal" style="animation-delay:-${d}s" d="M0 0 c 4 -6 10 -6 12 0 c -4 5 -9 5 -12 0z" fill="${petals[2]}"/></g>`).join("")}
  </svg>`;
}

const tabs = on => `<div class="tb">${[["☀","Today"],["💧","Care"],["❤","Health"],["☰","Lists"]].map(([i,l]) => `<span class="${l===on?"on":""}"><i>${i}</i>${l}</span>`).join("")}</div>`;
const full = (i, bloom) => scene("jenny", i, bloom).replace('class="scene"', 'class="scene" style="height:100%" preserveAspectRatio="xMidYMid slice"');
const O = [];

/* 1. Stepping-stone path */
const path = [["08:00","Morning","done",40,92],["","Morning care","done",150,150],["12:00","Midday","now",70,212],["19:00","Evening care","",170,272],["21:00","Bedtime","",60,330]];
O.push({n:"Stepping stones", why:"Best for: seeing the whole day at a glance, and the fun of hopping forward.",
 idea:"Your day is a winding path of lily pads across the pond, from morning at the top to bedtime at the bottom. Done pads turn blue, the one you're on glows pink, and a little paper boat sails to it. Tap any pad and its card slides up from the bottom.",
 a:`<div class="sc">${full(6,2)}<svg viewBox="0 0 262 420" style="position:absolute;left:0;top:30px;width:100%;height:420px"><path d="M60 70 C 200 90, 220 140, 170 160 S 40 200, 90 222 S 240 270, 190 282 S 40 320, 80 340" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="3 7" opacity=".9"/></svg>
   ${path.map(([t,l,s,x,y]) => `<div class="${s==="now"?"glow":""}" style="position:absolute;left:${x}px;top:${y}px;width:${s==="now"?78:64}px;height:${s==="now"?46:38}px;border-radius:50%;background:${s==="done"?"#8fcbe8":s==="now"?"#ffd6e2":"rgba(255,255,255,.75)"};border:2px solid #fff;display:grid;place-items:center;text-align:center;font:800 9px var(--sans);color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.1)">${s==="done"?"✓ ":""}${t||"🧴"}<br><span style="font-weight:700;font-size:8px">${l}</span></div>`).join("")}
   <div class="glass" style="position:absolute;left:10px;right:10px;top:12px;border-radius:16px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center"><span class="hand">Friday</span><span style="font:800 10px var(--sans)">2 of 5 · 🪷🪷</span></div>
   <div class="glass" style="position:absolute;left:10px;right:10px;bottom:62px;border-radius:22px;padding:12px"><span class="lead">Now · 12:00</span><div class="big">Midday</div><div class="row"><span>💊 Morning tablet</span><span class="btn b1">✓ Now</span></div></div>${tabs("Today")}</div>`,
 b:`<div class="sc">${full(6,2)}<div style="position:absolute;inset:0;background:rgba(30,50,80,.25)"></div><div class="glass" style="position:absolute;left:0;right:0;bottom:0;height:70%;border-radius:26px 26px 0 0;padding:16px"><div style="width:40px;height:4px;border-radius:2px;background:#ccd;margin:0 auto 10px"></div><span class="lead">Evening care · 19:00</span><div class="big">Evening care</div>${["🪥 Brush teeth","💧 Water floss","🫧 Mouthwash","🧴 Face wash","✨ Retinal","🌸 Moisturiser"].map((t,k) => `<div class="row"><span>${t}</span><span class="btn ${k<2?"b2":"b1"}">${k<2?"✓ done":"Do it"}</span></div>`).join("")}</div></div>`, capb:"Tap a pad: its card slides up"});

/* 2. Day dial */
const dial = (cx, cy, r) => [["08:00","done",-150],["12:00","now",-90],["19:00","",-20],["21:00","",30]].map(([t,s,a]) => { const x = cx + r*Math.cos(a*Math.PI/180), y = cy + r*Math.sin(a*Math.PI/180); return `<div class="${s==="now"?"glow":""}" style="position:absolute;left:${x-24}px;top:${y-24}px;width:48px;height:48px;border-radius:50%;background:${s==="done"?"#8fcbe8":s==="now"?"#ffd6e2":"#fff"};border:3px solid #fff;display:grid;place-items:center;font:800 9px var(--sans);color:var(--ink);box-shadow:0 4px 12px rgba(0,0,0,.12)">${s==="done"?"✓":t}</div>`; }).join("");
O.push({n:"Day dial", why:"Best for: knowing in one second how far through the day you are.",
 idea:"A round window onto your pond sits in the middle like a clock face, and your day goes around it: morning, midday, evening, bedtime. The pond inside blooms as you go. Underneath, only the one thing to do now.",
 a:`<div class="sc" style="background:linear-gradient(#d8ecfa,#fde4ee)"><div style="position:absolute;left:0;right:0;top:16px;text-align:center"><span class="hand" style="font-size:26px">Good afternoon, Jenny</span></div>
   <svg style="position:absolute;left:31px;top:60px" width="200" height="200"><circle cx="100" cy="100" r="92" fill="none" stroke="#fff" stroke-width="10"/><circle cx="100" cy="100" r="92" fill="none" stroke="#f19bb5" stroke-width="10" stroke-dasharray="190 600" transform="rotate(-210 100 100)" stroke-linecap="round"/></svg>
   <div style="position:absolute;left:51px;top:80px;width:160px;height:160px;border-radius:50%;overflow:hidden;border:5px solid #fff;box-shadow:0 8px 20px rgba(40,70,100,.2)">${scene("jenny",6,2).replace('class="scene"','class="scene" style="left:-70px;top:-150px;width:300px;height:auto"')}</div>
   ${dial(131, 160, 104)}
   <div class="glass" style="position:absolute;left:10px;right:10px;top:300px;border-radius:22px;padding:12px;box-shadow:0 8px 20px rgba(40,70,100,.12)"><span class="lead">Now · 12:00</span><div class="big">Midday</div><div class="row"><span>💊 Morning tablet</span><span><span class="btn b1">✓ Now</span> <span class="btn b2">🕐</span></span></div><div style="display:flex;gap:6px;margin-top:8px"><span class="btn b1" style="flex:1">✓ All taken now</span></div></div>${tabs("Today")}</div>`,
 b:`<div class="sc" style="background:linear-gradient(#141c43,#4a3f7d)"><div style="position:absolute;left:0;right:0;top:16px;text-align:center;color:#fff"><span class="hand" style="font-size:26px">Sleep well, Jenny</span></div>
   <svg style="position:absolute;left:31px;top:60px" width="200" height="200"><circle cx="100" cy="100" r="92" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="10"/><circle cx="100" cy="100" r="92" fill="none" stroke="#f19bb5" stroke-width="10" stroke-dasharray="480 600" transform="rotate(-210 100 100)" stroke-linecap="round"/></svg>
   <div style="position:absolute;left:51px;top:80px;width:160px;height:160px;border-radius:50%;overflow:hidden;border:5px solid #fff">${scene("jenny",5,4).replace('class="scene"','class="scene" style="left:-70px;top:-150px;width:300px;height:auto"')}</div>
   <div class="glass" style="position:absolute;left:10px;right:10px;top:300px;border-radius:22px;padding:14px;text-align:center"><div class="big" style="font-size:24px">All done 🪷</div><div style="font:600 11px var(--sans)">Pond in full bloom · 4 days in a row</div><span class="btn b1" style="margin-top:10px;width:100%">🌙 Lights out</span></div>${tabs("Today")}</div>`, capb:"At night: the dial is full, Lights out"});

/* 3. Swipe deck */
