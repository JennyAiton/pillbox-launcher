<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Well Together - pick a look</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@500;600;700;800&family=Caveat:wght@600&display=swap">
<style>
:root{--serif:"Cormorant Garamond",Georgia,serif;--sans:"Manrope",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:#f3efe7;color:#22302c;font:15px/1.45 var(--sans)}
header{padding:28px 16px 8px;text-align:center}header h1{font:600 40px var(--serif);margin:0}header p{margin:6px auto 0;max-width:640px;color:#5b6b66}
.opt{max-width:1100px;margin:26px auto;padding:18px 16px 24px;border-radius:28px;background:#fff;box-shadow:0 10px 30px rgba(30,50,40,.08)}
.opt h2{font:600 32px var(--serif);margin:0}.opt .idea{color:#5b6b66;margin:4px 0 14px;max-width:760px}
.opt .num{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#22302c;color:#fff;font:800 15px var(--sans);margin-right:8px;vertical-align:6px}
.phones{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.ph{width:280px;height:590px;border-radius:38px;padding:9px;background:#1b1f1e;box-shadow:0 16px 40px rgba(0,0,0,.25);flex:none}
.sc{position:relative;width:100%;height:100%;border-radius:30px;overflow:hidden;font-size:11px}
.cap{text-align:center;font:700 12px var(--sans);color:#5b6b66;margin-top:8px}
.scene{position:absolute;left:0;top:0;width:100%;height:600px}
.scene .fr{transform-box:view-box}.scene .fl{transform-origin:0 0}.scene .frr{transform-origin:400px 0}.scene .bob,.scene .rip{transform-box:fill-box;transform-origin:center}
.scene .bfly,.scene .birds,.scene .ffly{transform-box:view-box}
@media (prefers-reduced-motion:no-preference){.scene .fl{animation:sway 7s ease-in-out infinite alternate}.scene .frr{animation:sway 8.5s ease-in-out infinite alternate-reverse}.scene .crown{animation:sway 6s ease-in-out infinite alternate}.scene .bob{animation:bob 4s ease-in-out infinite alternate}.scene .rip{animation:ripple 6s ease-out infinite}.scene .rays{animation:spin 60s linear infinite}.scene .birds{animation:birds 26s linear infinite}.scene .bfly{animation:fly1 18s ease-in-out infinite}.scene .bfly.b2{animation:fly2 22s ease-in-out infinite}.scene .wing{animation:flap .35s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:right center}.scene .wing.r{transform:scaleX(-1);animation-name:flapr;transform-origin:left center}.scene .shim{animation:shim 3.5s ease-in-out infinite alternate}.scene .petal{animation:fall 13s linear infinite}}
@keyframes sway{from{transform:rotate(-2.2deg)}to{transform:rotate(2.2deg)}}@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}@keyframes ripple{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.7);opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes birds{from{transform:translate(-60px,70px)}to{transform:translate(460px,40px)}}@keyframes fly1{0%{transform:translate(40px,250px)}25%{transform:translate(150px,215px)}50%{transform:translate(250px,262px)}75%{transform:translate(140px,290px)}100%{transform:translate(40px,250px)}}@keyframes fly2{0%{transform:translate(360px,230px)}30%{transform:translate(260px,200px)}60%{transform:translate(200px,250px)}100%{transform:translate(360px,230px)}}@keyframes flap{from{transform:scaleX(1)}to{transform:scaleX(.35)}}@keyframes flapr{from{transform:scaleX(-1)}to{transform:scaleX(-.35)}}@keyframes shim{from{opacity:.15}to{opacity:.6}}@keyframes fall{0%{transform:translate(0,-20px) rotate(0);opacity:0}8%{opacity:.85}100%{transform:translate(70px,620px) rotate(300deg);opacity:0}}
/* shared bits */
.tb{position:absolute;left:10px;right:10px;bottom:10px;height:46px;border-radius:18px;display:flex;justify-content:space-around;align-items:center;font:800 8.5px var(--sans)}
.tb span{display:grid;justify-items:center;gap:1px;opacity:.6}.tb span.on{opacity:1}.tb i{font-style:normal;font-size:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 7px;border-radius:12px;margin-top:5px;font:700 10.5px var(--sans)}
.btn{border-radius:9px;padding:4px 7px;font:800 9.5px var(--sans)}
.big{font:600 34px/1 var(--serif);margin:4px 0}.lead{display:inline-block;font:800 8.5px var(--sans);letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:99px}
.h3{font:600 20px var(--serif);margin:10px 0 4px}
.lc{border-radius:14px;padding:9px 10px;margin-top:7px}
.pick{display:block;margin:16px auto 0;padding:12px 22px;border-radius:999px;border:0;background:#22302c;color:#fff;font:800 14px var(--sans)}
</style></head><body>
<header><h1>Well Together: pick a look</h1><p>Five ideas, all with palm trees and lotus flowers, one look for both of you. Each shows <b>Today</b> and the <b>Health</b> page. Tell me the number you like, or mix: "the top of 2 with the bottom of 4".</p></header>
<main id="opts"></main>
<script>
/* drawn scene, round 2 (19 Nov 2026, Jenny: "combine lotus and palm trees ... lively and inspiring"). i = time of day 1..5.
   The scene is a fixed-height backdrop at the top; the pond sits in the strip between the day curve and the card. */
const SKY = {1:["#ffd9b8","#f7b39a","#5fa8a3","#1f6466"], 2:["#bfe6f0","#e6f5e9","#4fb0a5","#16696a"], 3:["#9fd8ef","#dff3f4","#3fa79d","#126361"], 4:["#ffc58f","#f08f74","#3f8f93","#17505d"], 5:["#1c2a48","#33467a","#1d4f63","#0e2a3a"]};
function frond(x, y, a, len, col){ // one palm frond: a curved rib with leaflets
  let leaves = ""; const n = 12;
  for(let k = 1; k <= n; k++){ const t = k/(n+1), px = t*len, py = Math.sin(t*Math.PI)*len*.12, l = len*(.36 - t*.2);
    leaves += `<path d="M${px.toFixed(1)} ${py.toFixed(1)} q ${(l*.35).toFixed(1)} ${(l*.25).toFixed(1)} ${(l*.75).toFixed(1)} ${(l*.95).toFixed(1)} q ${(-l*.45).toFixed(1)} ${(-l*.35).toFixed(1)} ${(-l*.75).toFixed(1)} ${(-l*.95).toFixed(1)}z"/><path d="M${px.toFixed(1)} ${py.toFixed(1)} q ${(l*.35).toFixed(1)} ${(-l*.25).toFixed(1)} ${(l*.75).toFixed(1)} ${(-l*.95).toFixed(1)} q ${(-l*.45).toFixed(1)} ${(l*.35).toFixed(1)} ${(-l*.75).toFixed(1)} ${(l*.95).toFixed(1)}z"/>`; }
  return `<g transform="translate(${x} ${y}) rotate(${a})" fill="${col}"><path d="M0 0 Q ${len*.5} ${len*.16} ${len} ${len*.02}" stroke="${col}" stroke-width="3" fill="none"/>${leaves}</g>`;
}
function palmTree(bx, by, tx, ty, scale, c1, c2, cls){ // trunk from the shore up to a crown of fronds
  const mx = (bx + tx) / 2 + (tx > bx ? -30 : 30), my = (by + ty) / 2;
  let rings = ""; for(let k = 1; k < 9; k++){ const t = k/9, x = (1-t)*(1-t)*bx + 2*(1-t)*t*mx + t*t*tx, y = (1-t)*(1-t)*by + 2*(1-t)*t*my + t*t*ty; rings += `<path d="M${(x-6).toFixed(1)} ${y.toFixed(1)} q 6 4 12 0" stroke="#5b3d28" stroke-width="1.6" fill="none" opacity=".5"/>`; }
  const fr = [[200,1],[235,.92],[270,1.02],[305,.95],[340,1],[20,.9],[160,.88]].map(([a, k]) => frond(0, 0, a, 120*scale*k, a % 2 ? c1 : c2)).join("");
  return `<path d="M${bx} ${by} Q ${mx} ${my} ${tx} ${ty}" stroke="#7a5638" stroke-width="${9*scale}" stroke-linecap="round" fill="none"/>${rings}<g class="crown ${cls}" style="transform-origin:${tx}px ${ty}px">${`<g transform="translate(${tx} ${ty})">${fr}<circle r="${6*scale}" fill="#6b4a2f"/><circle cx="${7*scale}" cy="${4*scale}" r="${5*scale}" fill="#7d5a36"/></g>`}</g>`;
}
function lotusFlower(x, y, sc, p, d){ // layered petals with a soft gradient, golden heart
  const id = `lp${p[0]}${Math.round(x)}`;
  const pet = (r, s, f) => `<path transform="rotate(${r}) scale(${s})" d="M0 0 C -11 -16 -9 -40 0 -52 C 9 -40 11 -16 0 0Z" fill="${f}"/>`;
  return `<g transform="translate(${x} ${y}) scale(${sc})"><g class="bob" style="animation-delay:-${d}s"><defs><linearGradient id="${id}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="${p[0]}"/><stop offset="1" stop-color="${p[1]}"/></linearGradient></defs>
    <ellipse cx="0" cy="4" rx="34" ry="8" fill="#000" opacity=".12"/>${[-72,72,-52,52].map(r => pet(r, .9, p[2])).join("")}${[-30,30,-14,14].map(r => pet(r, 1, `url(#${id})`)).join("")}${pet(0, 1.05, `url(#${id})`)}
    <ellipse cx="0" cy="-8" rx="9" ry="5" fill="#f7cf5a"/><g fill="#e9a93a">${[-6,-2,2,6].map(dx => `<circle cx="${dx}" cy="-10" r="1.2"/>`).join("")}</g></g></g>`;
}
function bud(x, y, sc, p){ return `<g transform="translate(${x} ${y}) scale(${sc})"><g class="bob"><path d="M0 0 v 24" stroke="#3f7a52" stroke-width="2.5"/><path d="M0 0 C -9 -12 -6 -26 0 -32 C 6 -26 9 -12 0 0Z" fill="${p[1]}"/><path d="M0 0 C -4 -10 -3 -22 0 -28" stroke="${p[0]}" stroke-width="2" fill="none"/></g></g>`; }
function lilyPad(x, y, rx, col, rot){ return `<g transform="translate(${x} ${y}) rotate(${rot})"><path d="M0 0 L ${rx} -${rx*.12} A ${rx} ${rx*.36} 0 1 1 ${rx} ${rx*.12} Z" fill="${col}"/><path d="M0 0 L ${-rx*.7} ${-rx*.12} M0 0 L ${-rx*.5} ${rx*.2} M0 0 L ${rx*.3} ${rx*.28}" stroke="#ffffff" stroke-opacity=".18" stroke-width="1.2"/></g>`; }
function butterfly(cls, c1, c2){ const w = `<path d="M0 0 C -10 -12 -18 -6 -14 2 C -12 8 -4 6 0 0Z" fill="${c1}"/><path d="M0 0 C -8 6 -12 14 -6 14 C -2 13 0 6 0 0Z" fill="${c2}"/>`;
  return `<g class="bfly ${cls}"><g class="wing">${w}</g><g class="wing r">${w}</g><path d="M0 -4 v 10" stroke="#3b2a2a" stroke-width="1.6"/></g>`; }
function scene(p, i){
  const c = SKY[i] || SKY[2], night = i === 5, dusk = i === 4 || i === 1;
  const petals = p === "michaela" ? ["#fff7ea", "#fde2c4", "#f3cfa6"] : ["#fff4f2", "#f6b8bf", "#ee9fad"];
  const leaf = night ? "#1c4a3a" : "#2f7a4f", leaf2 = night ? "#255a45" : "#46955f", pad1 = night ? "#2a5e46" : "#4fa36a", pad2 = night ? "#234f3c" : "#3d8c58";
  const sun = night ? `<circle cx="300" cy="160" r="20" fill="#fbf4dc"/><circle cx="292" cy="154" r="20" fill="${c[0]}" opacity=".0"/>`
    : `<g class="rays" style="transform-origin:300px 205px">${[...Array(12)].map((_, k) => `<path transform="rotate(${k*30} 300 205)" d="M300 150 l 5 -26 l 5 26z" fill="#fff4c9" opacity=".55"/>`).join("")}</g><circle cx="300" cy="205" r="${dusk ? 34 : 28}" fill="${dusk ? "#ffd27a" : "#fff1b8"}"/>`;
  const stars = night ? [...Array(22)].map((_, k) => `<circle class="tw" style="animation-delay:-${(k*.37)%3}s" cx="${(k*73)%400}" cy="${20 + (k*41)%170}" r="${k % 3 ? 1.1 : 1.8}" fill="#fff"/>`).join("") : "";
  const birds = night ? "" : `<g class="birds" fill="none" stroke="#2c3e46" stroke-width="2" stroke-linecap="round"><path d="M0 0 q 6 -6 12 0 q 6 -6 12 0"/><path d="M30 14 q 5 -5 10 0 q 5 -5 10 0"/><path d="M-22 18 q 4 -4 8 0 q 4 -4 8 0"/></g>`;
  const flyers = night ? [...Array(6)].map((_, k) => `<circle class="ffly" style="animation-delay:-${k*1.3}s" cx="${50 + k*55}" cy="${250 + (k%3)*22}" r="2.2" fill="#fff3a8"/>`).join("")
    : butterfly("b1", "#f6a65a", "#f4c26a") + butterfly("b2", "#9fd0f0", "#c7a7e8");
  return `<svg class="scene" viewBox="0 0 400 860" preserveAspectRatio="xMidYMin slice" aria-hidden="true"><defs><linearGradient id="sky${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c[0]}"/><stop offset="1" stop-color="${c[1]}"/></linearGradient><linearGradient id="wat${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c[2]}"/><stop offset=".5" stop-color="${c[3]}"/></linearGradient></defs>
    <rect width="400" height="235" fill="url(#sky${i})"/>${stars}${sun}${birds}
    <path d="M0 222 Q 50 196 110 214 T 230 206 T 330 210 T 400 204 V 240 H 0Z" fill="${leaf2}" opacity=".55"/><path d="M0 232 Q 80 214 170 228 T 400 222 V 240 H 0Z" fill="${leaf}" opacity=".6"/>
    <rect y="234" width="400" height="626" fill="url(#wat${i})"/>
    <g class="shim" stroke="#fff" stroke-linecap="round" stroke-width="1.6"><path d="M250 246 h40 M262 254 h22 M120 262 h30 M40 250 h26 M200 300 h34 M320 296 h28"/></g>
    <g class="rip"><ellipse cx="190" cy="285" rx="34" ry="7" fill="none" stroke="#fff" stroke-opacity=".45"/></g><g class="rip r2"><ellipse cx="330" cy="318" rx="26" ry="6" fill="none" stroke="#fff" stroke-opacity=".45"/></g>
    ${lilyPad(70, 262, 34, pad2, -6)}${lilyPad(165, 318, 46, pad1, 10)}${lilyPad(300, 268, 30, pad1, -14)}${lilyPad(345, 330, 40, pad2, 6)}${lilyPad(240, 345, 34, pad2, -4)}${lilyPad(30, 330, 30, pad1, 14)}
    ${palmTree(26, 250, 74, 70, 1.05, leaf, leaf2, "cl")}${palmTree(392, 246, 336, 96, .9, leaf2, leaf, "cr")}
    ${bud(118, 270, .8, petals)}${bud(268, 262, .7, petals)}
    ${lotusFlower(84, 268, .62, petals, 0)}${lotusFlower(178, 322, .95, petals, 1.2)}${lotusFlower(300, 278, .7, petals, 2.1)}${lotusFlower(352, 336, .85, petals, .6)}
    <g class="fr fl">${frond(-24, -14, 34, 170, leaf)}${frond(-20, 10, 58, 140, leaf2)}</g><g class="fr frr">${frond(424, -14, 146, 170, leaf)}${frond(420, 12, 122, 140, leaf2)}</g>
    ${flyers}
    ${night ? "" : [[60,0],[200,4],[330,8]].map(([x, d]) => `<g transform="translate(${x} 0)"><path class="petal" style="animation-delay:-${d}s" d="M0 0 c 4 -6 10 -6 12 0 c -4 5 -9 5 -12 0z" fill="${petals[2]}"/></g>`).join("")}
  </svg>`;
}

const tick = "✓";
function tabs(st){ return `<div class="tb" style="${st}">${[["☀","Today",1],["▤","Stock"],["▦","Week"],["💧","Skin"],["❤","Health"],["☰","Lists"]].map(([i,l,on]) => `<span class="${on?"on":""}"><i>${i}</i>${l}</span>`).join("")}</div>`; }
function tabsH(st){ return tabs(st).replace('class="on"','class=""').replace('<span class=""><i>❤','<span class="on"><i>❤'); }
const meds = [["Morning tablet",""],["Vitamin D",""],["Multivitamin ×2","with breakfast"],["Omega-3",""]];
const O = [];

/* 1. Lagoon: today's layout, light below */
O.push({n:"Lagoon", idea:"What you have now, finished properly: the pond and palms at the top, one cream card for what to do now, and a light sand-coloured page underneath with white cards. Calm, simple, nothing dark.",
 today: `<div class="sc" style="background:#f6efe4">${scene("jenny",2)}
   <div style="position:absolute;left:8px;right:8px;top:34px;height:78px;border-radius:18px;background:rgba(255,255,255,.35);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.6)"><svg viewBox="0 0 100 40" style="width:100%;height:100%"><path d="M8 34 Q50 -6 92 34" fill="none" stroke="#fff" stroke-width="1.4" stroke-dasharray="2 3"/><path d="M8 34 Q30 10 50 7" fill="none" stroke="#2f6b57" stroke-width="2.2"/><circle cx="8" cy="34" r="4" fill="#2f6b57"/><circle cx="50" cy="7" r="5" fill="#fff" stroke="#2f6b57" stroke-width="1.5"/><circle cx="92" cy="34" r="4" fill="#fff"/></svg></div>
   <div style="position:absolute;left:10px;right:10px;top:190px;background:#fffaf2;border-radius:20px;padding:12px;box-shadow:0 10px 26px rgba(30,60,50,.18)"><span class="lead" style="background:#2f6b57;color:#fff">Now · 12:40</span><div class="big" style="color:#2f4a40">Midday</div>${meds.slice(0,2).map(([m]) => `<div class="row" style="background:#f1ebe0"><span>💊 ${m}</span><span class="btn" style="background:#2f6b57;color:#fff">✓ Now</span></div>`).join("")}<div style="display:flex;gap:6px;margin-top:8px"><span class="btn" style="flex:1;text-align:center;padding:8px;background:#2f6b57;color:#fff;border-radius:14px">✓ All taken now</span><span class="btn" style="padding:8px;background:#efe6d7;color:#2f4a40;border-radius:14px">🕐 Earlier</span></div></div>
   <div style="position:absolute;left:10px;right:10px;top:420px"><div class="h3" style="color:#2f4a40">Your day</div><div class="lc" style="background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06)">🌅 Morning · taken 08:10</div><div class="lc" style="background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06);border-left:4px solid #2f6b57">🌿 Midday · now</div></div>
   ${tabs("background:rgba(255,255,255,.92);color:#2f4a40;box-shadow:0 4px 16px rgba(0,0,0,.1)")}</div>`,
 health: `<div class="sc" style="background:#f6efe4"><div style="height:120px;position:relative;overflow:hidden">${scene("jenny",2).replace('class="scene"','class="scene" style="top:-150px"')}</div>
   <div style="padding:0 12px"><div class="h3" style="color:#2f4a40;font-size:26px">Our health</div>
   <div class="lc" style="background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06)"><b>🩺 GP check-up</b><br><span style="color:#6b7a74">Thu 26 Nov · 10:30</span><div style="margin-top:6px"><span class="btn" style="background:#2f6b57;color:#fff">📋 Report for the visit</span></div></div>
   <div class="lc" style="background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06)"><b>🧪 Blood test</b><br>Iron low, rest fine · <b>ferritin 18</b></div>
   <div class="lc" style="background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06)"><b style="color:#2f6b57;font-size:9px;letter-spacing:1px">MORNING</b><div class="row" style="background:#f6f1e8"><span>Morning tablet</span><u>change</u></div><div class="row" style="background:#f6f1e8"><span>Vitamin D</span><u>change</u></div></div></div>
   ${tabsH("background:rgba(255,255,255,.92);color:#2f4a40;box-shadow:0 4px 16px rgba(0,0,0,.1)")}</div>`});

/* 2. Lily-pad path: the day as stepping stones across the pond */
const pads = (y) => [["08:00","🌅",1],["12:40","🌿",2],["19:00","🍃",0],["21:00","🌙",0]].map(([t,e,s], k) => `<div style="position:absolute;left:${14 + k*62}px;top:${y + (k%2 ? -16 : 6)}px;width:56px;height:38px;border-radius:50%;background:${s===2?"#ffd166":s?"#4fa36a":"rgba(79,163,106,.55)"};display:grid;place-items:center;color:${s===2?"#3b2a00":"#fff"};font:800 10px var(--sans);box-shadow:0 4px 0 rgba(0,0,0,.12)">${s===1?"✓ ":""}${t}</div>`).join("");
O.push({n:"Lily-pad path", idea:"Your day becomes stepping stones across the pond: each lily pad is a time, filled green when it's done and gold for the one you're on. You hop from pad to pad. Below, a soft mint page.",
 today: `<div class="sc" style="background:#eaf5ee">${scene("jenny",3)}${pads(250)}
   <div style="position:absolute;left:10px;right:10px;top:318px;background:#fff;border-radius:22px;padding:12px;box-shadow:0 10px 26px rgba(30,80,60,.16)"><span class="lead" style="background:#ffd166;color:#3b2a00">Pad 2 of 4 · Midday</span><div class="big" style="color:#21463a">Tablets</div>${meds.slice(0,1).map(([m]) => `<div class="row" style="background:#eef7f1"><span>💊 ${m}</span><span><span class="btn" style="background:#21463a;color:#fff">✓ Now</span> <span class="btn" style="background:#fff;border:1px solid #cfe3d6">🕐</span> <span class="btn" style="background:#fff;border:1px solid #cfe3d6">✕</span></span></div>`).join("")}<div style="display:flex;gap:6px;margin-top:8px"><span class="btn" style="flex:1;text-align:center;padding:8px;background:#21463a;color:#fff;border-radius:14px">Hop to the next pad ›</span></div></div>
   ${tabs("background:#fff;color:#21463a;box-shadow:0 4px 16px rgba(0,0,0,.1)")}</div>`,
 health: `<div class="sc" style="background:#eaf5ee"><div style="height:110px;position:relative;overflow:hidden">${scene("jenny",3).replace('class="scene"','class="scene" style="top:-175px"')}</div>
   <div style="padding:0 12px"><div class="h3" style="color:#21463a;font-size:26px">Our health</div>
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px"><div class="lc" style="background:#4fa36a;color:#fff"><b style="font-size:20px">2</b><br>appointments</div><div class="lc" style="background:#ffd166;color:#3b2a00"><b style="font-size:20px">1</b><br>new result</div></div>
   <div class="lc" style="background:#fff"><b>🩺 GP check-up</b> · Thu 26 Nov<br><span style="color:#6b7a74">After the visit: what happened?</span></div><div class="lc" style="background:#fff"><b>🧪 Blood test</b> · ferritin 18</div></div>
   ${tabsH("background:#fff;color:#21463a;box-shadow:0 4px 16px rgba(0,0,0,.1)")}</div>`});

/* 3. Postcard: the scene framed like a holiday postcard, a timeline below */
O.push({n:"Postcard", idea:"The pond and palms sit in a framed holiday postcard at the top, like a picture on the fridge. Underneath, the day runs as a simple timeline with lotus bullets. Soft aqua and coral.",
