<script>
/* ---------------- the plan (same as before) ---------------- */
const START = "2026-11-07";
const THEMES = {
  jungle:{name:"Jungle", acc:"#c3f26b", ink:"#1b3006"},
  lotus:{name:"Lotus pond", acc:"#ff8fbf", ink:"#3a0d22"}
};
const P = {jenny:{name:"Jenny", theme:"lotus", slots:[]}, michaela:{name:"Michaela", theme:"jungle", slots:[]}};
const STOPPED = {}, SCRIPTS = [], CHECKS = [], FLAGS = {}, SHOP = [];
function applyPlan(x){
  for(const k in x.P) Object.assign(P[k], x.P[k]);
  Object.assign(STOPPED, x.STOPPED); Object.assign(FLAGS, x.FLAGS);
  SCRIPTS.splice(0, SCRIPTS.length, ...x.SCRIPTS); CHECKS.splice(0, CHECKS.length, ...x.CHECKS); SHOP.splice(0, SHOP.length, ...x.SHOP);
  window.__planReady = true;
}
/* ---------------- dates ---------------- */
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const dayDiff = (a,b) => Math.round((parse(a)-parse(b))/864e5);
const fmt = (s,o) => parse(s).toLocaleDateString("en-ZA", o || {weekday:"short", day:"numeric", month:"short"});
const toMin = s => { const [h,m] = s.split(":").map(Number); return h*60+m; };
const toHM = n => pad(Math.floor(n/60)%24) + ":" + pad(n%60);
const nowHM = () => { const n = new Date(); return pad(n.getHours())+":"+pad(n.getMinutes()); };
let TODAY = ymd(new Date());
const WAKE = {jenny:"08:00", michaela:"07:30"};

/* ---------------- state ---------------- */
const S = { who:HOME_WHO, tab:"today", sel:{}, log:{}, nudge:{}, setup:null, meta:{scripts:{}, checks:{}, settings:{}, refill:{}, pills:{}, setup:{}} };
/* whose pillbox opens: a personal link (#jenny / #michaela) wins, then this phone's last choice, then who is signed in */
let whoChosen = false;
{ const h = (location.hash || "").slice(1).toLowerCase(); if(P[h]){ S.who = h; whoChosen = true; } }
if(!whoChosen){ try { const w = localStorage.getItem("pillbox.who"); if(w && P[w]){ S.who = w; whoChosen = true; } } catch(e){} }
let db = null;
const other = p => p === "jenny" ? "michaela" : "jenny";
const themeOf = p => THEMES[(S.meta.settings.theme||{})[p] || P[p].theme] ? ((S.meta.settings.theme||{})[p] || P[p].theme) : P[p].theme;
const photo = (p, i) => `t/${themeOf(p)}/${i}.jpg`;
function rifaxOn(date){ const f = S.meta.settings.rifaxFrom; if(!f) return false; const k = dayDiff(date, f); return k >= 0 && k < 5; }
function logOf(p, date){ return S.log[p+"~"+date] || {person:p, date, done:{}, walk:0, physio:""}; }
/* usual wake-up time: per person, weekdays and weekends (Plan tab), else the defaults */
const isWeekend = date => { const d = parse(date).getDay(); return d === 0 || d === 6; };
/* learns the typical "I'm up" time from the last 3 weeks, weekdays and weekends apart */
function learnedWake(p, weekend){
  const lim = (() => { const d = new Date(); d.setDate(d.getDate()-21); return ymd(d); })();
  const mins = Object.values(S.log).filter(L => L.person === p && L.wake && L.date < TODAY && L.date >= lim && isWeekend(L.date) === weekend).map(L => toMin(L.wake)).sort((a,b) => a-b);
  if(mins.length < 3) return {n: mins.length, t: ""};
  const mid = mins.length % 2 ? mins[(mins.length-1)/2] : (mins[mins.length/2-1] + mins[mins.length/2]) / 2;
  return {n: mins.length, t: toHM(Math.round(mid/5)*5)};
}
const autoWake = p => (((S.meta.settings||{}).wakeAuto)||{})[p] !== false;
function usualWake(p, date){
  const w = ((S.meta.settings||{}).wake||{})[p] || {}, weekend = isWeekend(date);
  if(autoWake(p)){ const L = learnedWake(p, weekend); if(L.t) return L.t; }
  return (weekend ? w.we : w.wk) || WAKE[p];

let assets = null, snapFor = "";
function shrink(file){
  return new Promise((ok, bad) => { const img = new Image(); img.onload = () => { const s = Math.min(1, 600/Math.max(img.width, img.height)); const c = document.createElement("canvas"); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); c.toBlob(b => b ? ok(b) : bad(new Error("no image")), "image/jpeg", .82); URL.revokeObjectURL(img.src); }; img.onerror = bad; img.src = URL.createObjectURL(file); });
}

/* ---------------- Supabase: sign in, then load and listen ---------------- */
const SB = supabase.createClient(SB_URL, SB_KEY);
function mkDb(){
  return {
    doc(path){
      const i = path.indexOf("/"), coll = path.slice(0, i), id = path.slice(i+1);
      return { set: async body => { const { error } = await SB.from("docs").upsert({coll, id, data:body, updated_at:new Date().toISOString()}); if(error) throw error; } };
    },
    collection(coll){
      let flt = null;
      const q = {
        where(f, op, v){ flt = [f, v]; return q; },
        onSnapshot(cb, err){
          const load = async () => {
            let r = SB.from("docs").select("id,data").eq("coll", coll);
            if(flt) r = r.gte("data->>"+flt[0], flt[1]);
            const { data, error } = await r;
            if(error){ if(err) err(error); return; }
            cb({ docs: data.map(d => ({id:d.id, data:() => d.data})), metadata:{fromCache:false, hasPendingWrites:false} });
          };
          load();
          SB.channel("docs_"+coll).on("postgres_changes", {event:"*", schema:"public", table:"docs", filter:"coll=eq."+coll}, () => load()).subscribe();
          setInterval(load, 60000);
          document.addEventListener("visibilitychange", () => { if(!document.hidden) load(); });
        }
      };
      return q;
    }
  };
}

  applyPlan(pl.data.data); render();

  let firstMeta = true;
  db.collection("meta").onSnapshot(snap => {

    for(const k of ["scripts","checks","settings","refill","pills","setup"]) S.meta[k] = S.meta[k] || {};

  e.preventDefault();
  const msg = document.getElementById("loginMsg"); msg.textContent = "Signing in…";
  const { data, error } = await SB.auth.signInWithPassword({ email: document.getElementById("lEmail").value.trim(), password: document.getElementById("lPass").value });
  if(error){ msg.textContent = "That didn't work. Check the email and password."; return; }
  msg.textContent = ""; start(data.session);
});
SB.auth.getSession().then(({ data }) => { if(data.session) start(data.session); else document.getElementById("login").hidden = false; });

</script>
