/* the drawn scene and its gentle motion */
.hero .bg,.head .bg{background:none}
.hero .bg{background:#0f3a44}.hero .bg .scene{height:880px;bottom:auto}
.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene .fr{transform-box:view-box}
.scene .fl{transform-origin:0 0}.scene .frr{transform-origin:400px 0}
.scene .bob,.scene .rip{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:no-preference){
  .scene .fl{animation:sway 7s ease-in-out infinite alternate}.scene .frr{animation:sway 8.5s ease-in-out infinite alternate-reverse}
  .scene .bob{animation:bob 4s ease-in-out infinite alternate}
  .scene .rip{animation:ripple 6s ease-out infinite}.scene .r2{animation-delay:-3s}
  .scene .petal{animation:fall 13s linear infinite}
}
@media (prefers-reduced-motion:no-preference){
  .scene .crown{animation:sway 6s ease-in-out infinite alternate}.scene .crown.cr{animation-duration:7.5s;animation-direction:alternate-reverse}
  .scene .rays{animation:spin 60s linear infinite}
  .scene .birds{animation:birds 26s linear infinite}
  .scene .bfly{animation:fly1 18s ease-in-out infinite}.scene .bfly.b2{animation:fly2 22s ease-in-out infinite}
  .scene .wing{animation:flap .35s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:right center}.scene .wing.r{transform:scaleX(-1);animation-name:flapr;transform-origin:left center}
  .scene .shim{animation:shim 3.5s ease-in-out infinite alternate}
  .scene .tw{animation:tw 3s ease-in-out infinite alternate}.scene .ffly{animation:ffly 7s ease-in-out infinite}
}
.scene .bfly,.scene .birds,.scene .ffly{transform-box:view-box}

const pad = n => String(n).padStart(2,"0");

{ const h = (location.hash || "").slice(1).toLowerCase(); if(P[h]){ S.who = h; whoChosen = true; } }

  return `<g transform="translate(${x} ${y}) rotate(${a})" fill="${col}"><path d="M0 0 Q ${len*.5} ${len*.16} ${len} ${len*.02}" stroke="${col}" stroke-width="3" fill="none"/>${leaves}</g>`;

function patterns(p){

    out.push(`${flares.length} skin flare-up${flares.length > 1 ? "s" : ""} in the last month${rough ? `, ${rough} of them after a rough night` : ""}.`); }

  return out;

async function loadWeather(){ try { const c = JSON.parse(localStorage.getItem("wt.wx") || "null"); if(c && c.d === TODAY){ S.wx = c; return; } } catch(_){}
  try { const r = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${WX_AT.lat}&longitude=${WX_AT.lon}&daily=temperature_2m_max,uv_index_max&timezone=Africa%2FJohannesburg&forecast_days=1`)).json();
    S.wx = {d: TODAY, max: Math.round(r.daily.temperature_2m_max[0]), uv: Math.round(r.daily.uv_index_max[0])}; try { localStorage.setItem("wt.wx", JSON.stringify(S.wx)); } catch(_){} render(true); } catch(_){} }
const WATER_GOAL = 8;
function waterCard(p){ const L = logOf(p, TODAY), n = L.water || 0, hot = S.wx && S.wx.max >= 30, goal = WATER_GOAL + (hot ? 2 : 0);
  const nudge = S.wx && (S.wx.max >= 28 || S.wx.uv >= 8) ? `<div class="patt" style="margin-bottom:8px">☀ ${S.wx.max >= 30 ? "Hot today" : "Warm today"} (${S.wx.max}°${S.wx.uv >= 8 ? ", UV " + S.wx.uv : ""}): ${hot ? "2 extra glasses of water, and " : ""}top up your sunscreen at lunch.</div>` : "";
  return `<div class="sec"><h3>Water</h3><div class="card">${nudge}<div class="glasses">${[...Array(goal)].map((_, k) => `<button class="gl ${k < n ? "on" : ""}" data-water="${k < n && k === n - 1 ? n - 1 : k + 1}" aria-label="Glass ${k + 1}"><svg viewBox="0 0 20 26"><path d="M3 2 h14 l-2 22 h-10z" fill="${k < n ? "#8fcbe8" : "none"}" stroke="#5aa9c9" stroke-width="1.6"/></svg></button>`).join("")}</div><div class="small" style="margin-top:6px">${n} of ${goal} glasses${n >= goal ? " · well done 💧" : ""}</div></div></div>`; }

/* tablet photos: shrink on the phone, store as an asset, keep its id in meta/pills */
let assets = null, snapFor = "";
function shrink(file){
  return new Promise((ok, bad) => { const img = new Image(); img.onload = () => { const s = Math.min(1, 600/Math.max(img.width, img.height)); const c = document.createElement("canvas"); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); c.toBlob(b => b ? ok(b) : bad(new Error("no image")), "image/jpeg", .82); URL.revokeObjectURL(img.src); }; img.onerror = bad; img.src = URL.createObjectURL(file); });
}

function mkDb(){
  return {
    doc(path){
      const i = path.indexOf("/"), coll = path.slice(0, i), id = path.slice(i+1);
      return { set: async body => { const { error } = await SB.from("docs").upsert({coll, id, data:body, updated_at:new Date().toISOString()}); if(error) throw error; } };
    },
    collection(coll){
      let flt = null;
      const q = {
        where(f, op, v){ flt = [f, v]; return q; },
        onSnapshot(cb, err){
          const load = async () => {
            let r = SB.from("docs").select("id,data").eq("coll", coll);
            if(flt) r = r.gte("data->>"+flt[0], flt[1]);
            const { data, error } = await r;
            if(error){ if(err) err(error); return; }
            cb({ docs: data.map(d => ({id:d.id, data:() => d.data})), metadata:{fromCache:false, hasPendingWrites:false} });
          };
          load();
          SB.channel("docs_"+coll).on("postgres_changes", {event:"*", schema:"public", table:"docs", filter:"coll=eq."+coll}, () => load()).subscribe();
          setInterval(load, 60000);
          document.addEventListener("visibilitychange", () => { if(!document.hidden) load(); });
        }
      };
      return q;
    }
  };
}

async function start(session){
  document.getElementById("login").style.display = "none";
  const mine = EMAILS[(session.user.email||"").toLowerCase()];
  if(mine){ S.who = mine; window.ME = mine === "jenny" ? "Jenny" : "Michaela"; }
  const pl = await SB.from("docs").select("data").eq("coll","plan").eq("id","plan").maybeSingle();
  if(pl.error || !pl.data){ status("Can't load your plan - check the internet", true); document.getElementById("login").style.display = "grid"; document.getElementById("loginMsg").textContent = "Signed in, but the plan didn't load. Try again."; return; }
  applyPlan(pl.data.data); render();
  db = mkDb();
  const to = setTimeout(() => status("Can't reach saved ticks yet", true), 10000);
  const from = (() => { const d = new Date(); d.setDate(d.getDate()-60); return ymd(d); })();
  db.collection("log").where("date", ">=", from).onSnapshot(snap => {
    for(const doc of snap.docs) S.log[doc.id] = JSON.parse(JSON.stringify(doc.data()));
    clearTimeout(to); status("Saved"); render(true);
  }, () => { clearTimeout(to); status("Saved ticks can't be loaded", true); });
  db.collection("nudge").onSnapshot(snap => { for(const doc of snap.docs) S.nudge[doc.id] = doc.data(); render(true); }, () => {});
  db.collection("pillimg").onSnapshot(snap => { S.pimg = S.pimg || {}; for(const doc of snap.docs) S.pimg[doc.id] = (doc.data()||{}).img; render(true); }, () => {});
  let firstMeta = true;
  db.collection("meta").onSnapshot(snap => {
    for(const doc of snap.docs) S.meta[doc.id] = JSON.parse(JSON.stringify(doc.data()));
    for(const k of ["scripts","checks","settings","refill","pills","setup"]) S.meta[k] = S.meta[k] || {};
    if(firstMeta){ firstMeta = false; skinImport();
      let seen = false; try { seen = !!localStorage.getItem("pillbox.setupSeen."+S.who); } catch(_){}
      if(!setupOf(S.who).done && !seen && !S.setup){ S.setup = {p:S.who, step:0}; try{localStorage.setItem("pillbox.setupSeen."+S.who,"1")}catch(_){} }
    }
    render(true);
  }, () => {});
}
